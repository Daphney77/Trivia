<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd51f"><title>Think Fast — Duck Buzzer</title>
<style>
:root{--navy:#062b4d;--yellow:#ffd51f}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f3ec;color:var(--navy)}
body{display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100svh;padding:24px 18px 34px;text-align:center;background:linear-gradient(#fffaf1,#e7f5ff)}
h1{font-size:clamp(43px,12vw,68px);line-height:.92;margin:18px 0 8px;font-weight:950;letter-spacing:-3px}
.tag{font-size:clamp(19px,5.5vw,27px);font-weight:750;margin:0 0 16px}
.duck{width:84%;max-width:420px;aspect-ratio:1/1;object-fit:cover;object-position:50% 42%;border-radius:30px;box-shadow:0 12px 30px #062b4d22;margin:4px auto 18px;display:block}
.hint{font-weight:700;font-size:17px;margin:5px 0 15px}
button{width:94%;max-width:440px;min-height:122px;border:0;border-radius:38px;background:linear-gradient(#ffe33c,#f5bf00);color:var(--navy);box-shadow:0 10px 0 #c49400,0 18px 26px #4d3c0030;font-size:clamp(29px,8vw,43px);font-weight:950;cursor:pointer;touch-action:manipulation;padding:14px}
button:active,button.hit{transform:translateY(7px) scale(.985);box-shadow:0 3px 0 #c49400,0 8px 14px #4d3c0030}
button small{display:block;font-size:15px;letter-spacing:2px;margin-top:5px}
.status{height:32px;margin:18px 0 2px;font-size:18px;font-weight:850}.rule{font-size:16px;margin:0 auto;max-width:360px;line-height:1.35}
.note{font-size:12px;opacity:.65;margin-top:22px}
</style></head><body>
<main class="app">
<h1>THINK FAST!</h1>
<p class="tag">See it. Solve it. Claim it!</p>
<img class="duck" src="duck-poster.png" alt="Yellow rubber duck">
<p class="hint">Know the answer? Tap the duck button to claim it.</p>
<button id="claim">🐥 I GOT THIS ONE!<small>TAP TO ANSWER</small></button>
<div class="status" id="status">Ready 🐥</div>
<p class="rule">First voice gets the first attempt!</p>
<p class="note">Turn your phone's media volume up and keep this page open.</p>
</main>
<script>
const b=document.getElementById('claim'),s=document.getElementById('status');
function speak(){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance("I got this one!");
  u.volume=1; u.rate=1.18; u.pitch=1.12; u.lang="en-CA";
  const voices=speechSynthesis.getVoices();
  const preferred=voices.find(v=>v.lang==="en-CA" && /female|samantha|karen|moira/i.test(v.name))
    || voices.find(v=>v.lang==="en-CA")
    || voices.find(v=>/^en/i.test(v.lang));
  if(preferred)u.voice=preferred;
  speechSynthesis.speak(u);
  if(navigator.vibrate)navigator.vibrate(60);
  b.classList.add('hit');s.textContent="CLAIMED! 🙋‍♀️";
  setTimeout(()=>b.classList.remove('hit'),170);
  setTimeout(()=>s.textContent="Ready 🐥",1200);
}
b.addEventListener('click',speak);
</script></body></html>
