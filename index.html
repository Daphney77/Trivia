<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Think Fast!</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#fff9e9,#e5f6ff);color:#082e50;text-align:center;min-height:100vh}
main{max-width:520px;margin:auto;padding:26px 18px 40px}
h1{font-size:clamp(44px,13vw,70px);line-height:.9;margin:18px 0 10px;font-weight:950;letter-spacing:-3px}
.sub{font-size:23px;font-weight:750;margin:0 0 18px}
img{width:82%;max-width:390px;aspect-ratio:1/1;object-fit:cover;object-position:center 42%;border-radius:30px;box-shadow:0 12px 30px #062b4d22}
.prompt{font-size:18px;font-weight:700;margin:18px 0 14px}
button{width:94%;min-height:125px;border:0;border-radius:40px;background:linear-gradient(#ffe63d,#f4bd00);color:#082e50;box-shadow:0 10px 0 #bd9000,0 18px 28px #55400030;font-weight:950;font-size:clamp(42px,12vw,64px);cursor:pointer;touch-action:manipulation}
button small{display:block;font-size:15px;letter-spacing:3px;margin-top:-3px}
button:active{transform:translateY(7px);box-shadow:0 3px 0 #bd9000}
#status{font-size:19px;font-weight:850;height:30px;margin-top:20px}
.rule{font-size:16px;margin:2px 0}
.test{font-size:12px;opacity:.6;margin-top:22px}
</style>
</head>
<body>
<main>
<h1>THINK FAST!</h1>
<p class="sub">See it. Solve it. Claim it!</p>
<img src="duck.png" alt="Yellow duck">
<p class="prompt">Know the answer? Hit the buzzer.</p>
<button id="moo">MOO! 🐮<small>TO ANSWER</small></button>
<div id="status">Ready 🐥</div>
<p class="rule">First moo gets the first attempt!</p>
<p class="test">Turn your phone's media volume up.</p>
<audio id="audio" preload="auto">
  <source src="./moo.wav" type="audio/wav">
</audio>
</main>
<script>
const btn=document.getElementById("moo");
const audio=document.getElementById("audio");
const status=document.getElementById("status");

async function playMoo(){
  try{
    audio.pause();
    audio.currentTime=0;
    audio.volume=1;
    await audio.play();
    status.textContent="MOO! Answer now 🐮";
    if(navigator.vibrate) navigator.vibrate(60);
    setTimeout(()=>status.textContent="Ready 🐥",1200);
  }catch(err){
    status.textContent="Sound blocked — tap again";
  }
}
btn.addEventListener("click", playMoo);
</script>
</body>
</html>
