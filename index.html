<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf0">
<title>Trivia Time!</title>
<style>
:root{
  --navy:#082d4f; --cream:#fffaf0; --yellow:#ffca28; --yellow2:#ffe269;
  --blue:#6ec2f5; --blue2:#a9ddfb; --pink:#fbe1dd; --paleBlue:#dcefff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy)}
body{
  min-height:100svh;
  background:
    radial-gradient(circle at -3% 5%,#dcefff 0 10%,transparent 10.2%),
    radial-gradient(circle at 103% 5%,#fff0b9 0 10%,transparent 10.2%),
    radial-gradient(circle at -5% 95%,#fff0b9 0 12%,transparent 12.2%),
    radial-gradient(circle at 105% 95%,#dcefff 0 12%,transparent 12.2%),
    var(--cream);
}
main{width:min(100%,720px);margin:auto;padding:24px 18px 35px;text-align:center}
h1{
  margin:14px 0 4px;font-size:clamp(48px,13vw,82px);line-height:.92;
  font-weight:950;letter-spacing:-3px;
}
h1 span{color:var(--yellow)}
.tag{
  display:inline-block;background:var(--paleBlue);border-radius:999px;
  padding:7px 22px 9px;font-size:clamp(20px,5vw,29px);font-weight:700;
  transform:rotate(-.5deg);margin:5px 0 18px;
}
.side{
  max-width:580px;margin:0 auto 25px;padding:13px 18px 14px;
  background:var(--pink);border-radius:24px;font-size:17px;line-height:1.3;
}
.side strong{display:block;font-size:20px;margin-bottom:2px}
.prompt{font-size:17px;font-weight:800;margin:0 0 14px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.team{display:flex;flex-direction:column;align-items:center}
.group{font-size:15px;font-weight:950;letter-spacing:2px;margin-bottom:8px}
.buzzer{
  position:relative;width:min(39vw,250px);aspect-ratio:1;border:0;border-radius:50%;
  color:var(--navy);font-weight:950;cursor:pointer;touch-action:manipulation;
  box-shadow:0 15px 0 #1c2730,0 23px 28px #082d4f2a,inset 0 5px 4px #ffffff90;
  transition:transform .07s,box-shadow .07s;
}
.buzzer:active,.buzzer.hit{
  transform:translateY(10px);
  box-shadow:0 5px 0 #1c2730,0 10px 18px #082d4f25,inset 0 5px 4px #ffffff90;
}
.duck{background:linear-gradient(145deg,var(--yellow2),#f6b900)}
.bell{background:linear-gradient(145deg,var(--blue2),#48aef0)}
.icon{display:block;font-size:clamp(50px,12vw,82px);line-height:1;margin-bottom:4px}
.inside{display:block;font-size:clamp(17px,4vw,25px);letter-spacing:.5px}
.name{
  margin-top:21px;min-width:70%;padding:8px 18px;border-radius:999px;
  font-size:19px;font-weight:950;letter-spacing:1px;
}
.duckName{background:#ffedb0}.bellName{background:#cdeaff}
#status{height:31px;margin:25px 0 0;font-size:18px;font-weight:900}
.rule{margin:0;font-size:14px}
.footer{
  display:flex;align-items:center;gap:15px;margin:30px auto 0;max-width:570px;
  font-size:12px;letter-spacing:3px;font-weight:750;white-space:nowrap
}
.footer:before,.footer:after{content:"";height:1px;background:var(--navy);flex:1;opacity:.75}
@media(max-width:430px){
  main{padding-left:12px;padding-right:12px}
  .teams{gap:12px}
  .buzzer{width:min(41vw,190px)}
  .name{font-size:16px;margin-top:17px}
  .side{font-size:15px}.side strong{font-size:18px}
  .footer{font-size:9px;letter-spacing:1.8px;gap:8px}
}
</style>
</head>
<body>
<main>
  <h1>TRIVIA TIME<span>!</span></h1>
  <div class="tag">See it. Solve it. Buzz it.</div>

  <div class="side">
    <strong>Side effects may include:</strong>
    friendly competition and unexpected bragging rights.
  </div>

  <p class="prompt">Know it? Buzz in for your group.</p>

  <div class="teams">
    <div class="team">
      <div class="group">GROUP A</div>
      <button class="buzzer duck" id="duckBtn" aria-label="Group A Duckie buzzer">
        <span class="icon">🐥</span><span class="inside">GROUP A</span>
      </button>
      <div class="name duckName">DUCKIE</div>
    </div>

    <div class="team">
      <div class="group">GROUP B</div>
      <button class="buzzer bell" id="bellBtn" aria-label="Group B Bell buzzer">
        <span class="icon">🔔</span><span class="inside">GROUP B</span>
      </button>
      <div class="name bellName">BELL</div>
    </div>
  </div>

  <div id="status">Ready!</div>
  <p class="rule">First sound gets the first attempt.</p>
  <div class="footer">PLAY • LAUGH • LEARN • REPEAT</div>

  <audio id="duckAudio" preload="auto" playsinline src="duckie.mp3"></audio>
  <audio id="bellAudio" preload="auto" playsinline src="bell.mp3"></audio>
</main>

<script>
const duckAudio=document.getElementById("duckAudio");
const bellAudio=document.getElementById("bellAudio");
const status=document.getElementById("status");

function buzz(audio, btn, group, emoji){
  duckAudio.pause(); bellAudio.pause();
  duckAudio.currentTime=0; bellAudio.currentTime=0;
  audio.currentTime=0; audio.volume=1;
  audio.play().then(()=>{
    btn.classList.add("hit");
    status.textContent=group+" buzzed in! "+emoji;
    if(navigator.vibrate) navigator.vibrate(60);
    setTimeout(()=>btn.classList.remove("hit"),180);
    setTimeout(()=>status.textContent="Ready!",1400);
  }).catch(()=>{
    status.textContent="Sound blocked — tap again";
  });
}
document.getElementById("duckBtn").addEventListener("click",function(){
  buzz(duckAudio,this,"Group A","🐥");
});
document.getElementById("bellBtn").addEventListener("click",function(){
  buzz(bellAudio,this,"Group B","🔔");
});
</script>
</body>
</html>
